services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innerpeace-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=innerpeace_db
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173
      - AWS_BUCKET=innerpeace-bucket-objects-store
      - AWS_REGION=ap-south-1
      - AWS_S3_PUBLIC_BASE_URL=https://d1997ddho4gari.cloudfront.net
    networks:
      - innerpeace-backend-net

# PostgreSQL is already running externally on this machine - the
# `innerpeace-postgres` container (postgres:16-alpine), attached to the
# pre-existing `innerpeace_backend_net` network. This compose file does NOT
# manage it; we join the same external network and reach it as `postgres`.
networks:
  innerpeace-backend-net:
    name: innerpeace_backend_net
    external: true
